name: Sync with Upstream

on:
  schedule:
    # 每天 UTC 00:00，也就是北京时间早上 8:00 自动同步
    - cron: "0 0 * * *"
  workflow_dispatch:
    # 允许你手动触发同步

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sync upstream
        run: |
          git remote add upstream https://github.com/liyupi/ai-guide.git
          git fetch upstream
          git checkout main
          git merge --no-edit upstream/main
          git push origin main